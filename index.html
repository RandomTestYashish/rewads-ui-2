<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Rewards</title>
    <script>
      // Phones get the screen full-bleed with no device mockup, laid out at the design's
      // 375px width. Runs before first paint. `?view=mobile` / `?view=mockup` force a mode.
      (function () {
        var view = new URLSearchParams(location.search).get("view");
        var phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) <= 600;
        if (view ? view !== "mobile" : !phone) return;
        document.documentElement.classList.add("is-mobile");
        document.querySelector('meta[name="viewport"]').content = "width=375";
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e32121'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/phone.css" />
    <link rel="stylesheet" href="src/styles/page.css" />
    <link rel="stylesheet" href="src/styles/overlays.css" />
  </head>
  <body>
    <main id="root"></main>
    <script src="src/vendor/motion.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
