<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Rewards</title>
    <script>
      // Phones get the screen full-bleed with no device mockup, laid out at the design's
      // 375px width. Runs before first paint. `?view=mobile` / `?view=mockup` force a mode.
      (function () {
        var view = new URLSearchParams(location.search).get("view");
        var phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) <= 600;
        if (view ? view !== "mobile" : !phone) return;
        document.documentElement.classList.add("is-mobile");
        document.querySelector('meta[name="viewport"]').content = "width=375";
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e32121'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="root"></main>
    <script>
      // The host lets browsers reuse each file for ten minutes, so just after a deploy a page
      // could mix old and new files (a new script with an old stylesheet, say). Before starting,
      // check every stylesheet and script with the server, which also refreshes the browser's
      // copy; the page is then built from files that all belong to the same version.
      (async function () {
        var styles = ["tokens", "base", "phone", "page", "overlays", "polish", "option2"].map(function (name) {
          return "src/styles/" + name + ".css";
        });
        var motion = "src/vendor/motion.js";
        var entry = new URL("src/main.js", location.href).href;

        var checked = new Set();
        function check(url) {
          return fetch(url, { cache: "no-cache" }).then(function (response) {
            return response.text();
          });
        }
        // Modules are followed through their relative imports, so new files need no listing here.
        async function checkModule(url) {
          if (checked.has(url)) return;
          checked.add(url);
          var source = await check(url);
          var imports = Array.from(source.matchAll(/(?:from|import)\s+"(\.[^"]+)"/g), function (match) {
            return new URL(match[1], url).href;
          });
          await Promise.all(imports.map(checkModule));
        }
        try {
          await Promise.all(styles.map(check).concat(check(motion), checkModule(entry)));
        } catch (error) {
          // Offline or blocked: carry on with whatever the browser already has.
        }

        function add(tag, attributes, parent) {
          return new Promise(function (resolve) {
            var element = Object.assign(document.createElement(tag), attributes);
            element.onload = element.onerror = resolve;
            parent.append(element);
          });
        }
        await Promise.all(
          styles.map(function (href) {
            return add("link", { rel: "stylesheet", href: href }, document.head);
          }),
        );
        await add("script", { src: motion }, document.body); // classic script: must run before the modules
        add("script", { type: "module", src: entry }, document.body);
      })();
    </script>
  </body>
</html>
